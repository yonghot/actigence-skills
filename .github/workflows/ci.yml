name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: node scripts/validate.mjs
      - name: Every changed plugin has a new version (otherwise no PC receives it)
        run: node scripts/check-bumps.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
      - name: Secret and personal-data scan
        run: node scripts/scan.mjs
      - name: Build and verify zips
        run: node scripts/build-zips.mjs --out dist
      - name: Claude Code plugin validate (optional, CLI install is unverified in CI)
        continue-on-error: true
        run: npx --yes @anthropic-ai/claude-code plugin validate .
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build zips
        run: node scripts/build-zips.mjs --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes

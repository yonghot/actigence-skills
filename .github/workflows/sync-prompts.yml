name: sync-prompts

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sync-prompts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep the schedule alive (GitHub disables schedules after 60 idle days)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-prompts.yml/enable"
      - name: Pull cards from actigence.ai
        id: sync
        run: |
          node scripts/sync-prompts.mjs --json > "$RUNNER_TEMP/sync.json"
          cat "$RUNNER_TEMP/sync.json"
          if git status --porcelain | grep -q .; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi
      - name: Report items that need a manual merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const r=require(process.env.RUNNER_TEMP+"/sync.json");for(const a of r.attention)console.log(a)' > "$RUNNER_TEMP/attention.txt"
          if [ -s "$RUNNER_TEMP/attention.txt" ]; then
            title="sync-prompts: manual merge needed"
            if ! gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "$(printf 'The prompt sync found card changes it does not apply on its own:\n\n'; sed 's/^/- /' "$RUNNER_TEMP/attention.txt")"
            fi
          fi
      - name: Validate
        id: check
        if: steps.sync.outputs.changed == '1'
        continue-on-error: true
        run: |
          set -o pipefail
          { node scripts/validate.mjs && node scripts/scan.mjs && node scripts/build-zips.mjs --out "$RUNNER_TEMP/dist"; } 2>&1 | tee "$RUNNER_TEMP/check.txt"
      - name: Commit to main
        if: steps.sync.outputs.changed == '1' && steps.check.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: prompt cards from actigence.ai ($(node -e 'const r=require(process.env.RUNNER_TEMP+"/sync.json");console.log([...r.added.map(i=>"+"+i),...r.removed.map(i=>"-"+i),...r.changed].join(", ")||"metadata")'))"
          git push origin HEAD:main
      - name: Open a pull request instead (validation failed)
        if: steps.sync.outputs.changed == '1' && steps.check.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/prompts-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "sync: prompt cards from actigence.ai (needs review)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "sync: prompt cards from actigence.ai (validation failed)" --body "$(printf 'Automatic sync changed files but validation failed, so nothing was pushed to main.\n\n```\n'; tail -n 60 "$RUNNER_TEMP/check.txt"; printf '\n```\n')"
          exit 1
